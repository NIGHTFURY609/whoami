# Camera: the owner's phone, main rear camera, streamed by the web UI's phone.html (getUserMedia 640x480, JPEG over a
# WebSocket to webcam_stream.py --phone; ugv_bringup README "Phone browser camera"). K is valid only for that 640x480
# mode, landscape, with the focus the page locked; another phone, mode or zoom needs its own calibration.
# Calibrated: 2026-10-03 by the project owner with ROS camera_calibration (cameracalibrator, Lyrical), printed
#   checkerboard 10x7 inner corners, 0.020 m squares, 71 views saved through the browser stream at about 2 fps.
# Solved again from the calibrator's saved views with OpenCV calibrateCamera (k3 fixed at 0, as the calibrator does),
#   leaving out 11 consecutive views (47-57) with per-view error over 1.5 px: about half as sharp as the others and
#   still 1.7-4.4 px under the final model (blur or the focus moving). The calibrator's own all-views result was
#   fx 492, cx 299, tangential -0.017/-0.021 at RMS 1.22 px; this one is RMS 0.347 px over 60 views, worst 0.55 px.
# Coverage: the board centre stayed within x 159-489, y 64-341, so the image corners are extrapolated; recalibrate
#   with the board pushed into the corners if straight edges look bent at the image border.
# P is the alpha-0 rectified matrix (cv2.getOptimalNewCameraMatrix), the calibrator's convention.
image_width: 640
image_height: 480
camera_name: phone
camera_matrix:
  rows: 3
  cols: 3
  data: [455.11054,   0.     , 319.91235,
           0.     , 457.00877, 238.03488,
           0.     ,   0.     ,   1.     ]
distortion_model: plumb_bob
distortion_coefficients:
  rows: 1
  cols: 5
  data: [0.044891, -0.069804, -0.001640, 0.000590, 0.000000]
rectification_matrix:
  rows: 3
  cols: 3
  data: [1., 0., 0.,
         0., 1., 0.,
         0., 0., 1.]
projection_matrix:
  rows: 3
  cols: 4
  data: [457.52761,   0.     , 320.32999,   0.     ,
           0.     , 460.4213 , 237.37793,   0.     ,
           0.     ,   0.     ,   1.     ,   0.     ]
